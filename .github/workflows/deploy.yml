name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Execute remote SSH commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Exportar nvm/node/npm/pm2 al PATH
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/bin:/usr/local/bin

            # Ir a la carpeta del proyecto (ajusta si el nombre de la carpeta es diferente)
            cd ~/sw1_parcial1_backend || cd ~/backend

            # Actualizar código
            git pull origin main

            # Instalar dependencias y compilar
            npm install
            npm run build

            # Reiniciar el proceso en PM2 (o levantarlo si no existe)
            pm2 reload nest-api || pm2 start dist/main.js --name nest-api
            pm2 save
